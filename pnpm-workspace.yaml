packages:
  - apps/*
  - packages/*

catalog:
  # Tooling
  '@eslint/js': ^10.0.1
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.13.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  turbo: ^2.11.10
  # TypeScript 7 (native Go compiler) provides the `tsc` binary used by every
  # `typecheck` script. Tools that load the compiler API (typescript-eslint,
  # Next.js build-time checks) resolve `typescript`, which therefore points at
  # the API-compatible `@typescript/typescript6` package (its binary is `tsc6`).
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-7: npm:typescript@^7.0.2
  typescript-eslint: ^8.72.1
  vitest: ^5.0.5
  '@types/node': ^26.6.5
  # Runtime
  next: 16.5.0-canary.28
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  server-only: ^0.0.1
  zod: ^4.6.7
  # Data
  # Cloudflare CLI (replaces Wrangler for D1 migrations, queries and Worker config).
  cf: ^1.0.0-beta.23
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  miniflare: ^4.20260730.0
  '@cloudflare/workers-types': ^5.20261027.1
  # UI
  '@ariakit/react': ^0.4.42
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  happy-dom: ^21.0.4
  '@tailwindcss/vite': ^4.3.3
  # vinext (Next.js API surface on Vite). Its cf-based Cloudflare setup needs the v2 (beta)
  # Cloudflare Vite plugin, which reads cloudflare.config.ts.
  vinext: ^1.3.1
  '@vinext/cloudflare': ^1.2.1
  '@cloudflare/vite-plugin': 2.0.0-beta.v.5
  vite: ^8.3.5
  '@vitejs/plugin-rsc': ^0.5.38
  '@vitejs/plugin-react': ^6.1.2
  react-server-dom-webpack: ^19.3.1
  oxc-transform-react: ^0.156.0
  # End-to-end tests
  '@playwright/test': ^1.64.1
  '@next/playwright': 16.5.0-canary.28

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261027.1'
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - typescript-eslint@8.72.1
  - '@cloudflare/build-output-utils@0.9.5'
  - '@cloudflare/config@0.28.1'
  - '@cloudflare/runtime-types@0.1.16'
  - cf@1.0.0-beta.23
  - miniflare@5.20261023.0-beta
  - '@next/env@16.5.0-canary.28'
  - '@next/swc-darwin-arm64@16.5.0-canary.28'
  - '@next/swc-darwin-x64@16.5.0-canary.28'
  - '@next/swc-linux-arm64-gnu@16.5.0-canary.28'
  - '@next/swc-linux-arm64-musl@16.5.0-canary.28'
  - '@next/swc-linux-x64-gnu@16.5.0-canary.28'
  - '@next/swc-linux-x64-musl@16.5.0-canary.28'
  - '@next/swc-win32-arm64-msvc@16.5.0-canary.28'
  - '@next/swc-win32-x64-msvc@16.5.0-canary.28'
  - next@16.5.0-canary.28
  - '@cloudflare/vite-plugin@2.0.0-beta.v.5'
  - '@next/playwright@16.5.0-canary.28'
  - '@oxc-transform-react/binding-android-arm-eabi@0.156.0'
  - '@oxc-transform-react/binding-android-arm64@0.156.0'
  - '@oxc-transform-react/binding-darwin-arm64@0.156.0'
  - '@oxc-transform-react/binding-darwin-x64@0.156.0'
  - '@oxc-transform-react/binding-freebsd-x64@0.156.0'
  - '@oxc-transform-react/binding-linux-arm-gnueabihf@0.156.0'
  - '@oxc-transform-react/binding-linux-arm-musleabihf@0.156.0'
  - '@oxc-transform-react/binding-linux-arm64-gnu@0.156.0'
  - '@oxc-transform-react/binding-linux-arm64-musl@0.156.0'
  - '@oxc-transform-react/binding-linux-ppc64-gnu@0.156.0'
  - '@oxc-transform-react/binding-linux-riscv64-gnu@0.156.0'
  - '@oxc-transform-react/binding-linux-riscv64-musl@0.156.0'
  - '@oxc-transform-react/binding-linux-s390x-gnu@0.156.0'
  - '@oxc-transform-react/binding-linux-x64-gnu@0.156.0'
  - '@oxc-transform-react/binding-linux-x64-musl@0.156.0'
  - '@oxc-transform-react/binding-openharmony-arm64@0.156.0'
  - '@oxc-transform-react/binding-win32-arm64-msvc@0.156.0'
  - '@oxc-transform-react/binding-win32-ia32-msvc@0.156.0'
  - '@oxc-transform-react/binding-win32-x64-msvc@0.156.0'
  - oxc-transform-react@0.156.0

allowBuilds:
  esbuild: true
  workerd: true
