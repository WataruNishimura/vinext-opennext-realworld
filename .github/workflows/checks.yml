name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Turborepo's local cache (.turbo/cache): unchanged packages replay their lint, typecheck and test.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check
      # vinext's ESLint resolves `cloudflare:workers` env types from the gitignored
      # .cloudflare/types, which `cf workers types` writes (offline, no Cloudflare login).
      - name: Generate vinext Worker types
        run: pnpm --filter @realworld/vinext types
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
